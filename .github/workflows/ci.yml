name: Test / Tests / Pruebas
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OCE_AUDIT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/oce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
